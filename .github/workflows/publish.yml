name: Build and Publish

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jemplayer82/rag-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # stdio variant — for local use via Claude Desktop / Claude Code
      - name: Build and push :latest (stdio)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # HTTP variant — for mcp-shared Portainer stack (supergateway bridge)
      - name: Build and push :http (streamable HTTP)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.http
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:http
            ghcr.io/${{ env.IMAGE_NAME }}:http-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
